<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Hope Charity Drive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Hope Charity Drive</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="Type.html">Type</a></li>
                <li><a href="proof.html">Proof</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Together We Can Save Lives</h1>
            <p>Join our mission to provide food, education, and medical support. Your small contribution makes a big difference.</p>
            <a href="#donate-now" class="btn">Donate Now</a>
            <a href="about.html" class="btn btn-outline">Learn More</a>
        </div>
    </section>

    <section >
        <h2 class="section-title">Make a Donation</h2>
        <div class="donate-form">
            <form action="#">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" placeholder="Enter your age">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Donation Amount ($)</label>
                    <input type="number" placeholder="e.g. 100">
                </div>
                <div class="form-group">
                    <label>Cause</label>
                    <select>
                        <option>General Support</option>
                        <option>Education</option>
                        <option>Food Drive</option>
                        <option>Medical Aid</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Donate Securely</button>
            </form>
        </div>
    </section>
</body>
</html>
